name: Update README stats

on:
  schedule:
    # UTC 03:17 / China Standard Time 11:17; scheduled runs may be delayed.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Pin the renderer action; use its lockfile-pinned core instead of a moving npm tag.
      # Public statistics only. Do not add a personal token or count_private here.
      - name: Generate public statistics
        uses: readme-tools/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=radical&hide_border=true
          path: profile/stats.svg
          core_version: ''
          fail_on_error: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate public languages
        uses: readme-tools/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=radical&hide_border=true
          path: profile/top-langs.svg
          core_version: ''
          fail_on_error: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

      # An API failure stops this job; it never replaces the last good cards.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: readme-stats-${{ github.run_id }}
          path: |
            profile/stats.svg
            profile/top-langs.svg
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No third-party renderer or package installation in the write-permission job.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: readme-stats-${{ github.run_id }}
          path: profile
      - name: Commit updated cards only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            echo 'Cards are unchanged.'
            exit 0
          fi
          git commit -m 'chore: update public README statistics'
          git push origin HEAD:main
